---
- name: Erstelle Schnitzeljagd
  hosts: localhost
  gather_facts: true
  become: true

  # Teilnehmerliste aus dem Repo webtty-playground. Anderer Pfad:
  #   ansible-playbook setup-exercises.yaml -e teilnehmerliste=/pfad/jailed.yml
  # Aufgabenlisten (teil1, teil2, pro, ...) stehen in
  # roles/create-exercises/defaults/main.yaml
  vars_files:
    - "{{ teilnehmerliste | default('~/webtty-playground/vars/jailed.yml') }}"

  roles:
    - create-user
    - create-exercises

# Aufruf mit Tags. Jeder Teil kann einzeln ausgebracht werden:
#
#   ansible-playbook setup-exercises.yaml --tags=start   # Ordner + Lösungsdatei
#   ansible-playbook setup-exercises.yaml --tags=teil1   # Tag 1
#   ansible-playbook setup-exercises.yaml --tags=teil2   # Tag 2 (inkl. User plankton)
#   ansible-playbook setup-exercises.yaml --tags=pro     # Zusatzaufgaben
#
# Ohne --tags werden nur User plankton und die Start-Dateien angelegt.

### Lösung der Übungsaufgaben geben von folgenden Ergebnissen aus
#
# Kernel-Major-Version 6
# Debian-Major-Version 13 (Image debian:trixie in webtty-playground)
# Gruppe "jailed" (alle Teilnehmenden)
# 1 Befehl unter /usr/bin mit einem Sonderzeichen als Namen ("[")
