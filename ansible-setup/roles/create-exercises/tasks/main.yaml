---
# Aufgaben
###########
#
# Eine Liste aller Aufgaben findet sich in der README.md
#
# Die Teile können einzeln und in beliebiger Reihenfolge ausgebracht werden:
#   --tags start   Ordner ~/schnitzeljagd + readme, tipps, Lösungsdatei
#   --tags teil1   Aufgaben 01-11 (Tag 1)
#   --tags teil2   Aufgaben 12-21 (Tag 2)
#   --tags pro     Zusatzaufgaben und Sidequests
# Die Start-Tasks laufen bei jedem Teil mit, damit jeder Teil auch allein
# funktioniert.

# Start (zu Beginn des Workshops)
#################################

- name: Erstelle Schnitzeljagd-Ordner
  tags: ['start', 'teil1', 'teil2', 'pro']
  ansible.builtin.file:
    path: "/home/{{ item }}/schnitzeljagd"
    mode: '0750'
    owner: "{{ item }}"
    state: directory
    group: "{{ exercise_group }}"
  loop: "{{ ssh_jailed_users }}"

- name: Erstelle Readme.md, tipps und solution
  tags: ['start', 'teil1', 'teil2', 'pro']
  ansible.builtin.copy:
    src: "{{ src_dir }}/{{ item[0] }}"
    owner: "{{ item[1] }}"
    group: "{{ exercise_group }}"
    mode: '0644'
    dest: "/home/{{ item[1] }}/schnitzeljagd/{{ item[0] }}"
    # Die Lösungsdatei der Teilnehmenden bei einem erneuten Lauf nicht
    # überschreiben; readme und tipps dürfen aktualisiert werden.
    force: "{{ item[0] != '00_solution' }}"
  with_nested:
    - "{{ etc_files }}"
    - "{{ ssh_jailed_users }}"

# Teil 1
########
# force: false bei allen Aufgaben-Kopien: Ein erneuter Lauf überschreibt
# keine Dateien, die Teilnehmende bereits bearbeitet haben, und setzt keine
# Rechte zurück (Idempotenz).

- name: Erstelle Aufgaben für Tag 1 / Teil 1
  tags: ['teil1', 'never']
  ansible.builtin.copy:
    src: "{{ src_dir }}/{{ item[0] }}"
    owner: "{{ item[1] }}"
    group: "{{ exercise_group }}"
    dest: "/home/{{ item[1] }}/schnitzeljagd/"
    force: false
  with_nested:
    - "{{ teil1 }}"
    - "{{ ssh_jailed_users }}"

# Aufgabe 8; finde und führe Alias aus
- name: Erstelle Alias für Aufgabe 8
  tags: ['teil1', 'never']
  ansible.builtin.lineinfile:
    path: "/home/{{ item }}/.bashrc"
    create: true
    insertafter: "EOF"
    line: "alias quallenfischersong=/etc/quallenfischen/quallenfischersong.sh"
    state: present
    owner: "{{ item }}"
    group: "{{ exercise_group }}"
    mode: '0644'
  loop: "{{ ssh_jailed_users }}"

- name: Erstelle Ordner für Aufgabe 8
  tags: ['teil1', 'never']
  ansible.builtin.file:
    path: /etc/quallenfischen
    state: directory
    mode: "0755"

- name: Lege das Skript ab für Aufgabe 8
  tags: ['teil1', 'never']
  ansible.builtin.copy:
    src: quallenfischersong.sh
    dest: /etc/quallenfischen/quallenfischersong.sh
    owner: root
    group: root
    mode: "0755"

# Teil 2
########

- name: Erstelle Aufgaben für Tag 2 / Teil 2
  tags: ['teil2', 'never']
  ansible.builtin.copy:
    src: "{{ src_dir }}/{{ item[0] }}"
    owner: "{{ item[1] }}"
    group: "{{ exercise_group }}"
    dest: "/home/{{ item[1] }}/schnitzeljagd/"
    force: false
  with_nested:
    # Aufgabe 15 wird unten gesondert angelegt (Unterordner gehört root)
    - "{{ teil2 | difference(['15']) }}"
    - "{{ ssh_jailed_users }}"

# Aufgabe 12; Dateien vergleichen (Hardlinks); alle Fake
- name: Erstelle Hardlinks
  tags: ['teil2', 'never']
  ansible.builtin.file:
    src: "/home/{{ item[1] }}/schnitzeljagd/12/unterordner/bestellung"
    dest: "/home/{{ item[1] }}/schnitzeljagd/12/unterordner/bestellung_{{ item[0] }}"
    state: hard
    owner: "{{ item[1] }}"
    group: "{{ exercise_group }}"
  with_nested:
    - ['1', '2', '3', '4', '5', '6', '8', '9'] # Datei-Namen der Hardlinks
    - "{{ ssh_jailed_users }}"

# Richtige Lösung ist der Softlink!
# bestellung_7 ist ein symbolischer Link (relativ, damit er auch im Container
# unter demselben Pfad funktioniert). Hardlinks teilen sich die Inode mit
# "bestellung", der Softlink hat eine eigene Inode und zeigt in "ls -l" mit
# "->" auf sein Ziel.
- name: Erstelle Softlink für Lösung für Aufgabe 12
  tags: ['teil2', 'never']
  ansible.builtin.file:
    src: "bestellung"
    dest: "/home/{{ item }}/schnitzeljagd/12/unterordner/bestellung_7"
    state: link
    force: true
    owner: "{{ item }}"
    group: "{{ exercise_group }}"
  loop: "{{ ssh_jailed_users }}"

# Aufgabe 14; nicht lesbare Datei lesbar machen
- name: Passe Berechtigungen für Aufgabe 14 an
  tags: ['teil2', 'never']
  ansible.builtin.file:
    path: "/home/{{ item }}/schnitzeljagd/14/krabbenburgergeheimrezept"
    owner: root
    group: root
    mode: '0400'
  loop: "{{ ssh_jailed_users }}"

# Aufgabe 15; nicht lesbaren Ordner lesbar machen
# Der Ordner 15 und die Texte gehören dem User, der Unterordner root (0700).
# Getrennt von der allgemeinen Kopie, weil diese sonst bei jedem Lauf die
# Besitzer zurück auf den User setzt (nicht idempotent, und eine bereits
# gelöste Aufgabe wäre wieder "ungelöst").
- name: Erstelle Ordner für Aufgabe 15
  tags: ['teil2', 'never']
  ansible.builtin.file:
    path: "/home/{{ item }}/schnitzeljagd/15"
    state: directory
    owner: "{{ item }}"
    group: "{{ exercise_group }}"
    mode: '0755'
  loop: "{{ ssh_jailed_users }}"

- name: Lege Aufgabe und Tipps für Aufgabe 15 ab
  tags: ['teil2', 'never']
  ansible.builtin.copy:
    src: "{{ src_dir }}/15/{{ item[0] }}"
    dest: "/home/{{ item[1] }}/schnitzeljagd/15/{{ item[0] }}"
    owner: "{{ item[1] }}"
    group: "{{ exercise_group }}"
    mode: '0644'
  with_nested:
    - ['aufgabe', 'tipp1', 'tipp2', 'tipp3']
    - "{{ ssh_jailed_users }}"

- name: Lege Unterordner für Aufgabe 15 ab (gehört root, nicht lesbar)
  tags: ['teil2', 'never']
  ansible.builtin.copy:
    src: "{{ src_dir }}/15/unterordner"
    dest: "/home/{{ item }}/schnitzeljagd/15/"
    owner: root
    group: root
    mode: '0700'
    directory_mode: '0700'
    force: false
  loop: "{{ ssh_jailed_users }}"

# Aufgabe 17; Datei die keinem User und keiner Gruppe gehört
- name: Passe Datei an für Aufgabe 17
  tags: ['teil2', 'never']
  ansible.builtin.file:
    path: "/home/{{ item }}/schnitzeljagd/17/unterordner/Lorem/4/9/10/sometest"
    owner: 500
    group: 500
  loop: "{{ ssh_jailed_users }}"

# Aufgabe 21: Die Variable KAREN wird in der Rolle create-user in plankton's
# .bashrc und .profile gesetzt (sudo -i startet eine Login-Shell).

# Zusatzaufgaben (pro_*) und Sidequests
#######################################

- name: Erstelle Zusatzaufgaben und Sidequests
  tags: ['pro', 'never']
  ansible.builtin.copy:
    src: "{{ src_dir }}/{{ item[0] }}"
    owner: "{{ item[1] }}"
    group: "{{ exercise_group }}"
    dest: "/home/{{ item[1] }}/schnitzeljagd/"
    force: false
  with_nested:
    - "{{ pro + sidequests }}"
    - "{{ ssh_jailed_users }}"

# pro_06: Datei gehört dem User, der Ordner ist aber nicht schreibbar ->
# Löschen scheitert, obwohl man Besitzer der Datei ist.
- name: Ordner ohne Schreibrecht für pro_06
  tags: ['pro', 'never']
  ansible.builtin.file:
    path: "/home/{{ item }}/schnitzeljagd/pro_06/unterordner"
    state: directory
    owner: "{{ item }}"
    group: "{{ exercise_group }}"
    mode: '0555'
  loop: "{{ ssh_jailed_users }}"

# pro_07: Datei mit Attribut "immutable" (chattr +i, sichtbar mit lsattr).
# Im Container fehlt CAP_LINUX_IMMUTABLE, daher kann auch root dort das
# Attribut nicht entfernen. Benötigt ein Dateisystem mit Attribut-Support
# (ext4, xfs, btrfs). teardown.yml in webtty-playground entfernt das
# Attribut vor dem Löschen der Home-Verzeichnisse.
# (Nicht über ansible.builtin.file attributes: '+i' - das meldet bei jedem
# Lauf "changed", weil es "+i" mit z.B. "ie" vergleicht.)
- name: Prüfe Attribute der Datei für pro_07
  tags: ['pro', 'never']
  ansible.builtin.command: "lsattr /home/{{ item }}/schnitzeljagd/pro_07/datei"
  register: pro07_lsattr
  changed_when: false
  check_mode: false
  loop: "{{ ssh_jailed_users }}"
  when: pro07_immutable | bool

- name: Unveränderliche Datei für pro_07
  tags: ['pro', 'never']
  ansible.builtin.command: "chattr +i /home/{{ item.item }}/schnitzeljagd/pro_07/datei"
  loop: "{{ pro07_lsattr.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - pro07_immutable | bool
    - "'i' not in item.stdout.split()[0]"
  changed_when: true

# pro_08: Skript muss direkt startbar sein (./qualle.sh &)
- name: Ausführbares Skript für pro_08
  tags: ['pro', 'never']
  ansible.builtin.file:
    path: "/home/{{ item }}/schnitzeljagd/pro_08/qualle.sh"
    mode: '0755'
  loop: "{{ ssh_jailed_users }}"
